name: Update official feed

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-feed-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - name: Refresh public snapshot
        env:
          LLM_PROVIDER_KEY: ${{ secrets.LLM_PROVIDER_KEY }}
        run: node scripts/update-official-feed.mjs
      - name: Validate feed rules
        run: node --test scripts/official-feed-core.test.mjs
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- apps/web/public/official-feed.json; then
            echo 'Snapshot unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/public/official-feed.json
          git commit -m 'chore(feed): refresh official selection snapshot'
          git push origin HEAD:main
