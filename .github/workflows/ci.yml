name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
          cache: true
      - name: Ensure Corepack is available for workspace scripts
        run: command -v corepack >/dev/null || npm install --global corepack@0.34.6
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Regenerate typed API client
        run: pnpm api:generate
      - name: Check generated client is committed
        run: git diff --exit-code -- apps/web/src/app/core/api/generated
