<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

<header class="site-header">
  <a class="brand" routerLink="/">
    <span>Além do</span>
    <strong>SiSU</strong>
    <span class="brand__spark" aria-hidden="true">✳</span>
  </a>

  <button
    #mobileMenuButton
    class="mobile-menu-toggle"
    type="button"
    aria-controls="site-navigation"
    [attr.aria-expanded]="mobileMenuOpen()"
    (click)="toggleMobileMenu()"
  >
    {{ mobileMenuOpen() ? 'Fechar menu' : 'Abrir menu' }}
  </button>

  <nav
    id="site-navigation"
    class="site-nav"
    [class.site-nav--open]="mobileMenuOpen()"
    aria-label="Navegação principal"
  >
    <a routerLink="/oportunidades" (click)="closeMobileMenu()">Explorar vagas</a>
    <a routerLink="/instituicoes" (click)="closeMobileMenu()">Instituições</a>
    <a routerLink="/" fragment="como-funciona" (click)="closeMobileMenu()">Como funciona</a>
    <a routerLink="/" fragment="sobre" (click)="closeMobileMenu()">Sobre</a>
  </nav>

  <a class="site-header__cta" routerLink="/oportunidades" (click)="closeMobileMenu()">Explorar ↗</a>
</header>

<router-outlet />

<footer class="site-footer">
  <a class="site-footer__brand" routerLink="/">Além do SiSU.</a>
  <span>O edital e o portal oficial da instituição prevalecem sempre.</span>
  <a routerLink="/oportunidades">Explorar oportunidades ↗</a>
</footer>
